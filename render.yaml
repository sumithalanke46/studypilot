services:
  # FastAPI Web Service
  - type: web
    name: studypilot-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studypilot-db
          property: connectionString
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: studypilot-db
    region: oregon
    plan: free
    databaseName: studypilot
    user: studypilot_admin
